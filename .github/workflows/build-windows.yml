name: Build Windows ShopHisab

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine Node version from package.json
        id: node_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.engines -and $pkg.engines.node) {
            $nv = $pkg.engines.node
          } else {
            $nv = '18'
          }
          Write-Output "Using node version: $nv"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "node_version=$nv"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node_version.outputs.node_version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace npm dependencies once
        run: npm ci --include=optional

      - name: Build frontend
        run: npm run build:frontend

      - name: Setup Python 3.11 for backend build
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend Python dependencies and PyInstaller
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build backend.exe with PyInstaller
        working-directory: ./backend
        run: |
          python -m PyInstaller --noconfirm --clean backend.spec

      - name: Verify backend.exe exists
        shell: pwsh
        run: |
          $backendExe = Join-Path "${{ github.workspace }}" "backend\dist\backend.exe"

          if (-Not (Test-Path $backendExe)) {
            Write-Error "backend.exe not found at $backendExe"
            exit 1
          }

          Write-Output "Found backend.exe at $backendExe"


      - name: Test backend.exe on Windows
        shell: pwsh
        run: |
          $backendExe = "${{ github.workspace }}\\backend\\dist\\backend.exe"
          $stdoutLog = "${{ github.workspace }}\\backend\\backend-test-stdout.log"
          $stderrLog = "${{ github.workspace }}\\backend\\backend-test-stderr.log"
          $testData = "${{ github.workspace }}\\backend\\test-data"

          Write-Output "Starting backend.exe..."
          Write-Output "Path: $backendExe"

          New-Item -ItemType Directory -Force -Path $testData | Out-Null

          $env:PORT = "8005"
          $env:BACKEND_PORT = "8005"
          $env:APP_ENV = "production"
          $env:APP_DATA_DIR = $testData
          $env:PRODUCTION_DATABASE = "$testData\\a1_steel_cement.db"
          $env:DATABASE_URL = "sqlite:///$testData/a1_steel_cement.db"

          $process = Start-Process `
            -FilePath $backendExe `
            -WorkingDirectory "${{ github.workspace }}\\backend" `
            -PassThru `
            -RedirectStandardOutput $stdoutLog `
            -RedirectStandardError $stderrLog

          Write-Output "Backend PID: $($process.Id)"

          Start-Sleep -Seconds 8

          if ($process.HasExited) {
            Write-Output "backend.exe exited unexpectedly."
            Write-Output "Exit code: $($process.ExitCode)"

            Write-Output "--- STDOUT ---"
            Get-Content $stdoutLog -ErrorAction SilentlyContinue

            Write-Output "--- STDERR ---"
            Get-Content $stderrLog -ErrorAction SilentlyContinue

            exit 1
          }

          try {
            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:8005/health" `
              -UseBasicParsing `
              -TimeoutSec 10

            Write-Output "Backend HTTP status: $($response.StatusCode)"
            Write-Output "Backend response: $($response.Content)"
          }
          catch {
            Write-Output "Backend health check failed."
            Write-Output $_

            Write-Output "--- STDOUT ---"
            Get-Content $stdoutLog -ErrorAction SilentlyContinue

            Write-Output "--- STDERR ---"
            Get-Content $stderrLog -ErrorAction SilentlyContinue

            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue

          Write-Output "backend.exe Windows startup test PASSED."

      - name: Verify workspace Electron dependencies
        shell: pwsh
        run: |
          $electronRoot = Join-Path "${{ github.workspace }}" "node_modules"
          $appBuilderLib = Join-Path $electronRoot "app-builder-lib\templates\nsis"
          $messages = Join-Path $appBuilderLib "messages.yml"
          $assistedMessages = Join-Path $appBuilderLib "assistedMessages.yml"
          $appBuilder = Join-Path $electronRoot "app-builder-bin\win\x64\app-builder.exe"

          Write-Output "Checking workspace Electron dependencies..."

          if (-Not (Test-Path -LiteralPath $messages)) {
            Write-Error "Missing messages.yml: $messages"
            exit 1
          }

          if (-Not (Test-Path -LiteralPath $assistedMessages)) {
            Write-Error "Missing assistedMessages.yml: $assistedMessages"
            exit 1
          }

          if (-Not (Test-Path -LiteralPath $appBuilder)) {
            Write-Error "Missing app-builder.exe: $appBuilder"
            exit 1
          }

          Write-Output "Workspace Electron builder dependencies are complete."

      - name: Build Electron Windows installer
        run: npm --workspace electron run build:win:installer

      - name: Verify packaged backend and frontend resources exist
        shell: pwsh
        run: |
          $backendInResources = Join-Path "${{ github.workspace }}" "electron\dist\win-unpacked\resources\backend\backend.exe"
          $frontendInResources = Join-Path "${{ github.workspace }}" "electron\dist\win-unpacked\resources\app\frontend\index.html"

          if (-Not (Test-Path $backendInResources)) {
            Write-Error "Packaged backend.exe missing from resources: $backendInResources"
            Get-ChildItem "${{ github.workspace }}\electron\dist\win-unpacked" -Recurse -Force | Select-Object FullName
            exit 1
          }

          if (-Not (Test-Path $frontendInResources)) {
            Write-Error "Packaged frontend index missing from resources: $frontendInResources"
            Get-ChildItem "${{ github.workspace }}\electron\dist\win-unpacked" -Recurse -Force | Select-Object FullName
            exit 1
          }

          Write-Output "Verified packaged backend and frontend resources:"
          Write-Output "backend=$backendInResources"
          Write-Output "frontend=$frontendInResources"

      - name: Verify ShopHisab.exe in win-unpacked
        shell: pwsh
        run: |
          $winUnpacked = Join-Path "${{ github.workspace }}" "electron\dist\win-unpacked\ShopHisab.exe"

          if (-Not (Test-Path $winUnpacked)) {
            Write-Error "ShopHisab.exe not found at $winUnpacked"
            exit 1
          }

          Write-Output "Found ShopHisab.exe at $winUnpacked"

      - name: Smoke test packaged win-unpacked app
        shell: pwsh
        run: |
          $appExe = Join-Path "${{ github.workspace }}" "electron\dist\win-unpacked\ShopHisab.exe"
          $stdoutLog = Join-Path "${{ github.workspace }}" "electron\dist\smoke-test-stdout.log"
          $stderrLog = Join-Path "${{ github.workspace }}" "electron\dist\smoke-test-stderr.log"

          if (-Not (Test-Path $appExe)) {
            Write-Error "Packaged app exe missing: $appExe"
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\electron\dist" | Out-Null
          New-Item -ItemType File -Force -Path $stdoutLog | Out-Null
          New-Item -ItemType File -Force -Path $stderrLog | Out-Null

          Write-Output "Starting packaged Electron app: $appExe"
          $process = Start-Process -FilePath $appExe -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog

          $deadline = (Get-Date).AddSeconds(30)
          $healthy = $false

          while ((Get-Date) -lt $deadline) {
            try {
              $response = Invoke-WebRequest -Uri "http://127.0.0.1:8005/health" -UseBasicParsing -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                $healthy = $true
                break
              }
            }
            catch {
              Start-Sleep -Seconds 1
            }
          }

          if (-Not $healthy) {
            Write-Error "Packaged app failed to become healthy on http://127.0.0.1:8005/health"
            Write-Output "--- STDOUT ---"
            Get-Content $stdoutLog -ErrorAction SilentlyContinue
            Write-Output "--- STDERR ---"
            Get-Content $stderrLog -ErrorAction SilentlyContinue
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }

          Write-Output "Packaged app health check passed: http://127.0.0.1:8005/health"

          Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          Write-Output "Packaged app shutdown test passed."

      - name: Verify installer file exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem `
            -Path "${{ github.workspace }}\electron\dist" `
            -Filter "ShopHisab-Setup-*.exe" `
            -File |
            Select-Object -First 1

          if (-not $installer) {
            Write-Error "Installer ShopHisab-Setup-*.exe not found in electron/dist"
            Get-ChildItem "${{ github.workspace }}\electron\dist" -Force | Select-Object FullName
            exit 1
          }

          Write-Output "Installer: $($installer.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopHisab-Installer
          path: electron/dist/ShopHisab-Setup-*.exe
