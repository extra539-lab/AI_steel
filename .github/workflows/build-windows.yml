name: Build Windows ShopHisab

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine Node version from package.json
        id: node_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.engines -and $pkg.engines.node) {
            $nv = $pkg.engines.node
          } else {
            $nv = '18'
          }
          Write-Output "Using Node version: $nv"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "node_version=$nv"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ steps.node_version.outputs.node_version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root npm dependencies
        run: npm ci --include=optional

      - name: Install frontend npm dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        run: npm run build:frontend

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend Python dependencies and PyInstaller
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build backend.exe with PyInstaller
        working-directory: ./backend
        run: |
          python -m PyInstaller --noconfirm --clean --onefile run.py --name backend

      - name: Verify backend.exe exists
        shell: pwsh
        run: |
          $backendExe = Join-Path "${{ github.workspace }}" "backend\dist\backend.exe"
          if (-Not (Test-Path $backendExe)) {
            Write-Error "backend.exe not found at $backendExe"
            exit 1
          }
          Write-Output "Found backend.exe at: $backendExe"

      - name: Install Electron npm dependencies
        working-directory: ./electron
        run: npm install --include=optional

      - name: Verify electron-builder dependencies
        shell: pwsh
        run: |
          $root = "${{ github.workspace }}\node_modules"

          $appBuilderLib = Join-Path $root "app-builder-lib\templates\nsis"
          $messages = Join-Path $appBuilderLib "messages.yml"
          $assistedMessages = Join-Path $appBuilderLib "assistedMessages.yml"
          $appBuilder = Join-Path $root "app-builder-bin\win\x64\app-builder.exe"

          Write-Output "Checking app-builder-lib NSIS templates..."
          Write-Output "messages.yml: $messages"
          Write-Output "assistedMessages.yml: $assistedMessages"

          if (-Not (Test-Path -LiteralPath $messages)) {
            Write-Error "Missing app-builder-lib NSIS template: messages.yml"
            exit 1
          }

          if (-Not (Test-Path -LiteralPath $assistedMessages)) {
            Write-Error "Missing app-builder-lib NSIS template: assistedMessages.yml"
            exit 1
          }

          if (-Not (Test-Path -LiteralPath $appBuilder)) {
            Write-Error "Missing app-builder.exe: $appBuilder"
            exit 1
          }

          Write-Output "All required electron-builder files exist."

      - name: Build Electron Windows installer
        working-directory: ./electron
        run: npm run dist

      - name: Verify ShopHisab.exe in win-unpacked
        shell: pwsh
        run: |
          $winUnpacked = Join-Path "${{ github.workspace }}" "electron\dist\win-unpacked\ShopHisab.exe"
          if (-Not (Test-Path $winUnpacked)) {
            Write-Error "ShopHisab.exe not found at $winUnpacked"
            exit 1
          }
          Write-Output "Found ShopHisab.exe at: $winUnpacked"

      - name: Verify installer file exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "${{ github.workspace }}\electron\dist" -Filter "ShopHisab-Setup-*.exe" -File | Select-Object -First 1
          if (-not $installer) {
            Write-Error "ShopHisab installer not found in electron/dist"
            exit 1
          }
          Write-Output "Installer: $($installer.FullName)"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopHisab-Installer
          path: electron/dist/ShopHisab-Setup-*.exe
