name: Build Windows ShopHisab

on:
  workflow_dispatch: {}

jobs:
  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Node version from package.json (default 18)
        id: node_version
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.engines -and $pkg.engines.node) { $nv = $pkg.engines.node } else { $nv = '18' }
          Write-Output "Using node version: $nv"
          Add-Content -Path $env:GITHUB_OUTPUT -Value "node_version=$nv"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node_version.outputs.node_version }}

      - name: Install npm dependencies (root)
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend

      - name: Setup Python 3.11 for backend build
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend Python dependencies and PyInstaller
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build backend.exe with PyInstaller
        working-directory: ./backend
        run: |
          python -m PyInstaller --noconfirm --clean --onefile run.py --name backend

      - name: Verify backend.exe exists
        run: |
          if (-Not (Test-Path -Path "backend\dist\backend.exe")) { Write-Error "backend.exe not found at backend\\dist\\backend.exe"; exit 1 }
        shell: pwsh

      - name: Build Electron Windows installer
        working-directory: ./electron
        run: |
          npm run dist

      - name: Verify ShopHisab.exe in win-unpacked
        run: |
          $winUnpacked = Join-Path -Path "${{ github.workspace }}" -ChildPath "electron\dist\win-unpacked\ShopHisab.exe"
          if (-Not (Test-Path -Path $winUnpacked)) { Write-Error "ShopHisab.exe not found at electron\dist\win-unpacked\ShopHisab.exe"; exit 1 }
          Write-Output "Found ShopHisab.exe at: $winUnpacked"
        shell: pwsh

      - name: Verify installer file exists
        run: |
          $installer = Get-ChildItem -Path "${{ github.workspace }}\electron\dist" -Filter "ShopHisab-Setup-*" -File | Select-Object -First 1
          if (-not $installer) { Write-Error "Installer ShopHisab-Setup-*.exe not found in electron/dist"; exit 1 }
          Write-Output "Installer: $($installer.FullName)"
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShopHisab-Installer
          path: electron/dist/ShopHisab-Setup-*.exe
