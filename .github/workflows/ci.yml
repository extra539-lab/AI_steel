name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install backend deps
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r backend/requirements.txt
      - name: Run tests
        env:
          APP_ENV: test
          APP_DATA_DIR: ${{ github.workspace }}/backend/test-data
          PRODUCTION_DATABASE: ${{ github.workspace }}/backend/test-data/a1_steel_cement.db
          DATABASE_URL: sqlite://${{ github.workspace }}/backend/test-data/a1_steel_cement.db
        run: |
          . .venv/bin/activate
          python backend/test_system.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install & build
        run: |
          cd frontend
          npm ci
          npm run build
